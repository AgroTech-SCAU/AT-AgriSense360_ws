handheld_scanner_timesync:
  ros__parameters:
    # Stable alias created by config/70-handheld-scanner-serial.rules.
    # Do not use /dev/ttyACMx: enumeration order changes when the GNSS
    # receiver is plugged in before the mainboard.
    port: /dev/handheld-scanner-timesync
    baudrate: 115200

    # One full TIME/IO/CAMERA/RADAR/LINK cycle every poll_period_s.
    poll_period_s: 2.0
    command_timeout_s: 0.4
    reconnect_period_s: 2.0

    # The board may reset when the CDC port opens; wait before polling.
    open_settle_s: 1.0

    # TimeSyncStatus is not a spatial quantity, so leave the header frame empty.
    frame_id: ""
