schema_version: 1
status: EVALUATION_CANDIDATE_PINNED
candidate:
  repository: https://github.com/Ericsii/FAST_LIO_ROS2.git
  commit: 2fffc570a25d0df172720bac034fbdb6a13d2162
  license: GPL-2.0
  production_approval: false

# The upstream HKU-MARS FAST_LIO repository is ROS 1 oriented. A ROS 2 port
# must pass source, license, message, maintenance and replay review before pinning.
required_inputs:
  pointcloud_topic: /sensors/lidar/points
  pointcloud_type: sensor_msgs/msg/PointCloud2
  imu_topic: /sensors/lidar/imu
  imu_type: sensor_msgs/msg/Imu

required_outputs:
  odometry_topic: /localization/lio/odometry
  path_topic: /localization/lio/path
  registered_cloud_topic: /mapping/cloud_registered
  map_frame: map
  odometry_frame: odom          # target; see implementation_notes
  body_frame: lidar_imu_link

implementation_notes:
  - FAST-LIO2 currently stamps /localization/lio/odometry with the map frame
    and publishes map -> lidar_imu_link. map -> odom -> base_link is reserved
    for the loop-closure/GNSS stage; no such transform is published yet.
  - The live profile uses the upstream MID360 evaluation seed for the
    LiDAR-to-IMU extrinsics until calibration exists. Acceptance still
    requires measured values.

acceptance:
  bag_replay_reproducible: true
  parameters_versioned: true
  fake_extrinsics_forbidden: true
  runtime_minutes_without_exit: 30
