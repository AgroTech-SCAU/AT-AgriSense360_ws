pointcloud_to_laserscan:
  ros__parameters:
    # FAST-LIO publishes the current registered scan in its moving body frame.
    target_frame: lidar_imu_link
    transform_tolerance: 0.10

    # Keep a horizontal band around the MID360. These values are a baseline
    # for the handheld bag and must be retuned after the sensor mounting height
    # and orientation are fixed on the robot.
    min_height: -0.50
    max_height: 0.50

    angle_min: -3.14159265359
    angle_max: 3.14159265359
    angle_increment: 0.00872664626
    scan_time: 0.10
    range_min: 0.50
    range_max: 30.0
    use_inf: true
    inf_epsilon: 1.0
    queue_size: 20
